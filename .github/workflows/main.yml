name: Run Telegram AI Multi-Bot

on:
  workflow_dispatch: # Bisa dinyalakan manual dengan sekali klik
  schedule:
    - cron: '0 */6 * * *' # Otomatis restart setiap 6 jam (24/7)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # Berhenti rapi sebelum batas 6 jam GitHub Actions

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install FFmpeg & Vulkan CPU Driver (Untuk Real-ESRGAN)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mesa-vulkan-drivers libvulkan1 wget unzip

      - name: 4. Download & Setup AI Real-ESRGAN Portable
        run: |
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip -O realesrgan.zip
          unzip -q -o realesrgan.zip
          chmod +x realesrgan-ncnn-vulkan

      - name: 5. Install Library Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 6. Jalankan Bot Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          python bot.py || true
